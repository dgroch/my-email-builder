# Render Blueprint — https://render.com/docs/blueprint-spec
# In Render: New → Blueprint → connect the repo → this file is auto-detected.
# Managed Postgres. Everything the Studio owns (authored components and their versions,
# campaign layouts, brand overrides) plus saved designs live here, so nothing is lost on a
# redeploy — the free plan has no persistent disk, and DATA_DIR is wiped every deploy.
# Render generates the credentials and injects them as DATABASE_URL below.
databases:
  - name: email-builder-db
    plan: free
    databaseName: emailbuilder
    user: emailbuilder

services:
  - type: web
    name: my-email-builder
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      - key: DATABASE_URL
        fromDatabase:
          name: email-builder-db
          property: connectionString
      # Where the bundled design-system images are fetched from by whoever OPENS the email.
      # Unset, it is derived from the request's Host header — right for the preview, wrong for
      # an export taken off a laptop, which then bakes in a localhost URL that is a dead image
      # in every inbox. /api/export refuses (422 UNREACHABLE_ASSET_BASE) rather than ship that.
      # On Render the derived host is publicly reachable, so this is optional here; set it to
      # serve the assets from a CDN instead of from this instance.
      #   PUBLIC_ASSETS_BASE  — e.g. https://cdn.figandbloom.com/email-assets
      #
      # Storage backends, most durable first. Saved designs go to Notion when it is
      # configured, otherwise to Postgres (DATABASE_URL above), otherwise to local
      # disk at DATA_DIR — which is ephemeral on the free plan. The Studio's own
      # records always use Postgres when DATABASE_URL is set. GET /api/health
      # reports which backend each store resolved to.
      # Optional, only if you want designs in Notion rather than Postgres (set in
      # the Render dashboard, kept out of the blueprint since they're secrets):
      #   NOTION_TOKEN        — internal integration secret (https://www.notion.so/my-integrations)
      #   NOTION_DESIGNS_DB   — the "Email Designs" database id
      #   STUDIO_CACHE_MS     — optional, default 5000. How long an instance may serve a
      #                         published library another instance has already changed.
      #
      # Campaign generator ("Create campaign" button → POST /api/campaigns/generate).
      # The system prompt + user template are bundled under lib/prompts/. The
      # host calls the LLM (default Anthropic Claude Sonnet 4). Set in Render:
      #   ANTHROPIC_API_KEY              — required; or use CAMPAIGN_LLM_API_KEY
      #   CAMPAIGN_LLM_MODEL             — optional, default 'claude-sonnet-4-20250514'
      #   CAMPAIGN_LLM_BASE_URL          — optional, default https://api.anthropic.com
      #   CAMPAIGN_LLM_MAX_TOKENS        — optional, default 4096
      #   CAMPAIGN_LLM_TEMPERATURE       — optional, default 0.7
      #   CAMPAIGN_LLM_PROVIDER          — optional, default 'anthropic'
      #
      # Live context (passed into the LLM call so generated campaigns reference
      # real products / audiences / blog URLs / lifestyle imagery instead of
      # stale snapshots).
      #   SHOPIFY_STORE_DOMAIN           — optional, default 'figandbloom.com' (no auth needed for the public feed)
      #   KLAVIYO_API_KEY                — already set above; used for live audiences
      #   NOTION_TOKEN                   — already set above; (still used for the saved-designs Notion DB; no longer needed for blog)
      #   SHOPIFY_BLOG_FEED_URL          — optional, default 'https://figandbloom.com/blogs/news.atom' (Shopify-published Atom feed, no auth, top 20 most recent posts)
      #   SHOPIFY_BLOG_MAX               — optional, default 20 (cap on number of posts returned)
      #   ASSET_LIBRARY_URL              — optional, default 'https://asset-library-u70t.onrender.com' (semantic image search; no auth, just a Referer header)
      #   ASSET_LIBRARY_REFERER          — optional, default 'https://my-email-builder.onrender.com/' (the Referer header the asset library expects)
      # Live context is cached for 15 minutes. Add ?fresh=1 to /api/live-context to bypass.
