<!-- COMPONENT: blocks/journal-tile | DESIGNED BLOCK — SLICED (MULTI-REGION) "FROM THE JOURNAL" STACK (2–3 LINKED ARTICLE TILES)
TOKENS:
  {{SECTION_LABEL}}     — NeuzeitGro Bold caps micro-label (e.g. "FROM THE JOURNAL")
  {{SECTION_HEADLINE}}  — Lust display — SENTENCE CASE (e.g. "More from Kellie")
  {{TILE_1_IMAGE_URL}}  — tile 1 photo (4:5 crop, 200×250px display)
  {{TILE_1_EYEBROW}}    — NeuzeitGro caps micro-label (e.g. "KELLIE")
  {{TILE_1_TITLE}}      — Lust display — SENTENCE CASE (post title, ~6 words)
  {{TILE_1_TEASER}}     — NeuzeitGro Light teaser (~12 words)
  {{TILE_1_LINK_URL}}   — tile 1 post URL
  {{TILE_2_IMAGE_URL}}  — tile 2 photo (4:5 crop)
  {{TILE_2_EYEBROW}}    — NeuzeitGro caps micro-label
  {{TILE_2_TITLE}}      — Lust display — SENTENCE CASE
  {{TILE_2_TEASER}}     — NeuzeitGro Light teaser
  {{TILE_2_LINK_URL}}   — tile 2 post URL
  {{TILE_3_IMAGE_URL}}  — tile 3 photo (4:5 crop) — OPTIONAL: set "" to render a 2-up stack
  {{TILE_3_EYEBROW}}    — OPTIONAL ("")
  {{TILE_3_TITLE}}      — OPTIONAL ("")
  {{TILE_3_TEASER}}     — OPTIONAL ("")
  {{TILE_3_LINK_URL}}   — OPTIONAL ("")
RULES:
  - SLICED (multi-region), not live HTML: on the Klaviyo push the block rasterises to brand-font
    PNGs like every other designed block, but as ONE SLICE PER REGION — a header slice plus one
    slice per tile — so all 2–3 distinct per-tile links survive (each tile slice is wrapped in its
    own <a href>). This replaces the old live-HTML build, whose only reason to exist was keeping
    the per-tile links; rasterising was breaking brand (forced link underlines, Georgia fallback).
  - Regions are marked with data-eb-slice (the generic multi-region slicer in lib/render.js):
      · header  — data-eb-slice="header", data-eb-alt=SECTION_HEADLINE  (no link)
      · tile n  — data-eb-slice="tile-n", data-eb-href=TILE_n_LINK_URL, data-eb-alt=TILE_n_TITLE
    The regions tile the clay band's full height with no gaps: the top band padding falls to the
    header region and the bottom band padding to the last tile region, so the slices stack back
    together seamlessly. Slice names on push: journal-tile-header, journal-tile-1 … journal-tile-3.
  - Brand fonts (the block is an image now): title → Lust (sentence case), eyebrow/teaser/"Read the
    piece →" → NeuzeitGro, section label → NeuzeitGro Bold caps, section headline → Lust.
  - TITLE is sentence case. EYEBROW renders uppercase via CSS.
  - Tiles are STACKED vertically: each is a white card with the image on the LEFT and the text on
    the RIGHT (200×250 image, object-position center top). Fixed 600-wide layout — no mobile
    collapse; the emitted slices scale as images on mobile like every other block.
  - Clay (#D8CCBE) section band so the module CONTRASTS with the dark email body (#2c2825);
    white tile cards with hairline #e8e2da borders; square corners.
  - Tile 3 is wrapped in {{#TILE_3_IMAGE_URL}} … {{/TILE_3_IMAGE_URL}} — the assembler's
    conditional-section pass drops it when the URL is empty, so a 2-up emits header + 2 tile slices.
  - No price, no PANEL_* palette tokens — keep it lean. Token surface is unchanged from the old
    live-HTML build: existing saved designs need no edits.
-->
<tr><td style="padding:0;background:#D8CCBE;">
  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" class="jt">
    <tr data-eb-slice="header" data-eb-alt="{{SECTION_HEADLINE}}"><td style="padding:42px 28px 20px;text-align:center;">
      <p style="font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:700;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#6f6354;margin:0 0 10px;">{{SECTION_LABEL}}</p>
      <p style="font-family:'Lust',Georgia,'Times New Roman',serif;font-weight:normal;font-size:26px;color:#2c2825;line-height:1.25;margin:0;">{{SECTION_HEADLINE}}</p>
    </td></tr>
    <!-- TILE 1 -->
    <tr class="jt-row" data-eb-slice="tile-1" data-eb-href="{{TILE_1_LINK_URL}}" data-eb-alt="{{TILE_1_TITLE}}"><td style="padding:7px 28px;">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border:1px solid #e8e2da;"><tr>
        <td class="jt-img" width="200" valign="top" style="width:200px;padding:0;overflow:hidden;vertical-align:top;">
          <a href="{{TILE_1_LINK_URL}}" style="display:block;text-decoration:none;">
            <img src="{{TILE_1_IMAGE_URL}}" width="200" height="250" alt="" style="display:block;width:200px;height:250px;object-fit:cover;object-position:center top;border:0;">
          </a>
        </td>
        <td class="jt-txt" valign="top" style="padding:0;height:250px;vertical-align:top;">
          <a class="jt-txt-link" href="{{TILE_1_LINK_URL}}" style="display:block;box-sizing:border-box;height:250px;padding:22px 26px;text-decoration:none;">
            <span style="display:block;text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:700;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#9a948c;margin:0 0 7px;">{{TILE_1_EYEBROW}}</span>
            <span style="display:block;text-decoration:none;font-family:'Lust',Georgia,'Times New Roman',serif;font-size:19px;color:#2c2825;line-height:1.3;margin:0 0 8px;">{{TILE_1_TITLE}}</span>
            <span style="display:block;text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:300;font-size:12px;color:#6b655e;line-height:1.55;margin:0 0 12px;">{{TILE_1_TEASER}}</span>
            <span style="text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#2c2825;">Read the piece &rarr;</span>
          </a>
        </td>
      </tr></table>
    </td></tr>
    <!-- TILE 2 -->
    <tr class="jt-row" data-eb-slice="tile-2" data-eb-href="{{TILE_2_LINK_URL}}" data-eb-alt="{{TILE_2_TITLE}}"><td style="padding:7px 28px;">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border:1px solid #e8e2da;"><tr>
        <td class="jt-img" width="200" valign="top" style="width:200px;padding:0;overflow:hidden;vertical-align:top;">
          <a href="{{TILE_2_LINK_URL}}" style="display:block;text-decoration:none;">
            <img src="{{TILE_2_IMAGE_URL}}" width="200" height="250" alt="" style="display:block;width:200px;height:250px;object-fit:cover;object-position:center top;border:0;">
          </a>
        </td>
        <td class="jt-txt" valign="top" style="padding:0;height:250px;vertical-align:top;">
          <a class="jt-txt-link" href="{{TILE_2_LINK_URL}}" style="display:block;box-sizing:border-box;height:250px;padding:22px 26px;text-decoration:none;">
            <span style="display:block;text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:700;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#9a948c;margin:0 0 7px;">{{TILE_2_EYEBROW}}</span>
            <span style="display:block;text-decoration:none;font-family:'Lust',Georgia,'Times New Roman',serif;font-size:19px;color:#2c2825;line-height:1.3;margin:0 0 8px;">{{TILE_2_TITLE}}</span>
            <span style="display:block;text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:300;font-size:12px;color:#6b655e;line-height:1.55;margin:0 0 12px;">{{TILE_2_TEASER}}</span>
            <span style="text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#2c2825;">Read the piece &rarr;</span>
          </a>
        </td>
      </tr></table>
    </td></tr>
    <!-- TILE 3 — optional: dropped by the conditional-section pass when TILE_3_IMAGE_URL is "" -->
    {{#TILE_3_IMAGE_URL}}
    <tr class="jt-row" data-eb-slice="tile-3" data-eb-href="{{TILE_3_LINK_URL}}" data-eb-alt="{{TILE_3_TITLE}}"><td style="padding:7px 28px;">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border:1px solid #e8e2da;"><tr>
        <td class="jt-img" width="200" valign="top" style="width:200px;padding:0;overflow:hidden;vertical-align:top;">
          <a href="{{TILE_3_LINK_URL}}" style="display:block;text-decoration:none;">
            <img src="{{TILE_3_IMAGE_URL}}" width="200" height="250" alt="" style="display:block;width:200px;height:250px;object-fit:cover;object-position:center top;border:0;">
          </a>
        </td>
        <td class="jt-txt" valign="top" style="padding:0;height:250px;vertical-align:top;">
          <a class="jt-txt-link" href="{{TILE_3_LINK_URL}}" style="display:block;box-sizing:border-box;height:250px;padding:22px 26px;text-decoration:none;">
            <span style="display:block;text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:700;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#9a948c;margin:0 0 7px;">{{TILE_3_EYEBROW}}</span>
            <span style="display:block;text-decoration:none;font-family:'Lust',Georgia,'Times New Roman',serif;font-size:19px;color:#2c2825;line-height:1.3;margin:0 0 8px;">{{TILE_3_TITLE}}</span>
            <span style="display:block;text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:300;font-size:12px;color:#6b655e;line-height:1.55;margin:0 0 12px;">{{TILE_3_TEASER}}</span>
            <span style="text-decoration:none;font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,Arial,sans-serif;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#2c2825;">Read the piece &rarr;</span>
          </a>
        </td>
      </tr></table>
    </td></tr>
    {{/TILE_3_IMAGE_URL}}
    <tr><td style="font-size:0;line-height:0;height:22px;">&nbsp;</td></tr>
  </table>
</td></tr>
