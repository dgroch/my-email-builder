<!-- COMPONENT: products/card-live | LIVE PRODUCT CARD — 4:5 PHOTO LEFT / INFO RIGHT (HTML-SAFE)
TOKENS:
  {{PRODUCT_IMAGE_URL}} — 4:5 product photo, shown 280px wide (560×700px source). On the Shopify CDN ask for width=560&height=700 with no crop, so a photo that is not 4:5 is scaled to fit, never cut.
  {{PRODUCT_LABEL}}     — optional small uppercase label above the name (e.g. "Back in stock"). Leave "" to omit.
  {{PRODUCT_NAME}}      — Lust font — SENTENCE CASE      — product name; also the photo's alt text
  {{PRODUCT_NOTE}}      — optional italic line under the name: one reassurance or occasion line. Leave "" to omit.
  {{PRODUCT_PRICE}}     — price line, e.g. "Signature · $195.00"
  {{CTA_TEXT}}          — button label, 2–3 words, verb first (e.g. "See it again")
  {{PRODUCT_URL}}       — product page URL. The photo, the name and the button all link here.
  {{BTN_WIDTH}}         — Outlook-only button width in px (e.g. "180px"), or "auto" to size it to the label. Default: auto.
RULES:
  - HTML-SAFE: never sliced. This is the product card for per-recipient data: every token can
    carry the ESP's own template tags (a catalog lookup, an event property), because the block
    reaches Klaviyo as live HTML and Klaviyo fills it at send time. A sliced card would bake
    the literal tag into the pixels. Listed in assembly.html_only_components.
  - The photo keeps its own ratio: width is fixed, height follows the image, and nothing is
    cropped by CSS. Supply a 4:5 photo and the card is 280×350; supply another ratio and the
    card follows it rather than cutting the product.
  - Order is fixed: label, name, note, price, button. The specifics (price) close the card and
    sit directly above the one action, so nothing separates the product from its button.
  - Stays side by side on a phone (the photo column narrows to 44%), so the button stays near
    the top of the email instead of landing below a full-width photo.
  - One per email. For a curated edit of several products, use card-horizontal and
    card-horizontal-reversed, which are rasterised.
  - OUTLOOK: a VML roundrect draws the button and the <a> is hidden from Word, as in
    sections/button. BTN_WIDTH sizes the VML only.
-->
<tr><td style="padding:0;background:#ffffff;">
<table class="f600" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-top:1px solid #e8e2da;">
  <tr>
    <td class="cl-img" width="280" valign="middle" style="width:280px;padding:0;vertical-align:middle;line-height:0;font-size:0;">
      <a href="{{PRODUCT_URL}}" target="_blank" style="display:block;line-height:0;text-decoration:none;"><img src="{{PRODUCT_IMAGE_URL}}" width="280" alt="{{PRODUCT_NAME}}" border="0" style="display:block;width:280px;height:auto;border:0;"></a>
    </td><td class="cl-txt" valign="middle" style="padding:32px 32px 32px 36px;vertical-align:middle;">
      {{#PRODUCT_LABEL}}<p style="font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,sans-serif;font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#666666;margin:0 0 10px 0;">{{PRODUCT_LABEL}}</p>{{/PRODUCT_LABEL}}
      <h3 class="pn" style="font-family:'Lust',Georgia,'Times New Roman',serif;font-weight:normal;font-style:normal;font-size:24px;color:#000000;line-height:1.15;margin:0 0 10px 0;"><a href="{{PRODUCT_URL}}" target="_blank" style="color:#000000;text-decoration:none;">{{PRODUCT_NAME}}</a></h3>
      {{#PRODUCT_NOTE}}<p style="font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,sans-serif;font-weight:300;font-style:italic;font-size:13px;color:#444444;line-height:1.6;margin:0 0 14px 0;">{{PRODUCT_NOTE}}</p>{{/PRODUCT_NOTE}}
      <p style="font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,sans-serif;font-weight:700;font-size:13px;color:#000000;line-height:1.4;margin:0 0 22px 0;">{{PRODUCT_PRICE}}</p>
      <!--[if gte mso 9]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                   href="{{PRODUCT_URL}}" arcsize="0%" stroke="f" fillcolor="#000000"
                   style="height:40px;width:{{BTN_WIDTH}};v-text-anchor:middle;">
        <w:anchorlock/>
        <center style="font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#ffffff;">{{CTA_TEXT}}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !gte mso 9]><!-->
      <a class="cl-btn" href="{{PRODUCT_URL}}" target="_blank" style="font-family:'NeuzeitGro','Gill Sans','Gill Sans MT',Calibri,sans-serif;font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:#000000;color:#ffffff;text-decoration:none;padding:14px 28px;display:inline-block;">{{CTA_TEXT}}</a>
      <!--<![endif]-->
    </td>
  </tr>
</table>
</td></tr>
