<!-- Light-only: iOS/Apple Mail and Gmail auto-invert email colours in dark mode, but they
     only invert LIVE HTML — images are never touched. Our Klaviyo push is a mix (designed
     blocks ship as rasterised image slices, html_only_components ship as live HTML), so
     without this opt-out the email renders as a patchwork: sliced blocks keep their designed
     colours while live blocks flip (a live black band under a black hero slice went WHITE).
     Declaring the email light-only keeps every block exactly as designed. -->
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">

<style>
/* PRODUCTION: No base64 fonts. Font CDN link above for Apple Mail/iOS.
   All elements use fallback stacks inline. */
:root{color-scheme:light;supported-color-schemes:light;}
*{margin:0;padding:0;box-sizing:border-box;}
body,table,td{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;}
img{border:0;line-height:100%;outline:none;text-decoration:none;display:block;}
table{border-collapse:collapse;}

@media only screen and (max-width:600px){
  .ew{width:100%!important;}
  .f600{width:100%!important;max-width:100%!important;}
  .fm{width:100%!important;}
  /* Full-bleed 600px images, paired with the inline `width:100%;max-width:600px` on the tag.
     The cap has to be a VIEWPORT unit, not a percentage. An image that has not loaded — a bad
     URL, or images off, which is how a great many people read email — takes its intrinsic size
     from its width/height attributes, so it has a 600x600 aspect ratio and a definite CSS
     height. `width:100%` against a shrink-to-fit table is then resolved back through that ratio
     to 600px, which becomes the table's minimum width. That held the ENTIRE document at 600px
     on a 375px screen, and everything on it — every block, not just this one — was scaled to
     0.625, which is how 14px body copy arrived at 8.8px. A percentage max-width cannot fix it
     (it resolves to none against an indefinite container); 100vw is definite, so it caps the
     image at the viewport and lets the table shrink. Height is deliberately left as declared:
     these crop with object-fit, and letting height follow width would throw away the crop the
     designer chose with IMG_HEIGHT. Clients without vw support simply behave as they did
     before, so this can only improve on the status quo. */
  .fimg{width:100%!important;max-width:100vw!important;}
  .hh{font-size:38px!important;line-height:1.0!important;}
  .sh{font-size:22px!important;}
  .pn{font-size:18px!important;}
  .uh{font-size:28px!important;}
  .sp{padding-left:24px!important;padding-right:24px!important;}
  .hp{padding:32px 24px!important;}
  .it{direction:ltr!important;}
  .itc{display:block!important;width:100%!important;}
  .iti{width:100%!important;height:auto!important;}
  .dpcc{display:block!important;width:100%!important;padding:32px 24px!important;}
  .hc{display:block!important;width:100%!important;}
  .hi{display:block!important;width:100%!important;height:240px!important;}
  .hi img{width:100%!important;height:240px!important;}
  .hinfo{display:block!important;width:100%!important;padding:24px!important;}
  .pt{display:block!important;width:100%!important;}
  .ptimg{display:block!important;width:100%!important;border-right:none!important;border-bottom:1px solid #e8e2da!important;}
  .pttesti{display:block!important;width:100%!important;padding:32px 24px!important;}
  .ud{min-height:0!important;padding:56px 28px!important;}
  .uil{height:200px!important;}
  .cc{display:block!important;width:100%!important;border-right:none!important;border-bottom:1px solid #e8e2da;padding:16px 0!important;}
  .cc:last-child{border-bottom:none!important;}
  .fi{display:block!important;}
  /* blocks/story — portrait + narrative stack, portrait goes fluid.
     The block carried .st* classes but the media block targeted none of them, so it stayed a
     fixed 600px two-column table and held the whole document at 600px. */
  .st-col{display:block!important;width:100%!important;padding:32px 24px!important;}
  .st-col-img{padding-bottom:0!important;}
  .st-img{width:100%!important;height:auto!important;}
  .st-polaroid{display:block!important;transform:none!important;}
  .st-illo{display:none!important;}
  /* blocks/feature-list — the block that had no classes at all. Same stack. */
  .fl-col{display:block!important;width:100%!important;padding:32px 24px!important;}
  .fl-col-img{padding-bottom:0!important;}
  .fl-img{width:100%!important;height:auto!important;}
  .fl-polaroid{display:block!important;transform:none!important;}
  .fl-bullet{width:34px!important;}
  /* blocks/journal-tile — live HTML on export, so its tiles stack too. */
  .jt-img{display:block!important;width:100%!important;}
  .jt-imgel{width:100%!important;height:auto!important;}
  .jt-txt{display:block!important;width:100%!important;height:auto!important;}
  .jt-txt-link{height:auto!important;padding:20px 24px!important;}
  /* blocks/annotated-product — image + notes stack, like story and feature-list. */
  .ap-col{display:block!important;width:100%!important;padding:32px 24px!important;}
  .ap-col-img{padding-bottom:0!important;}
  .ap-img{width:100%!important;height:auto!important;}
  /* blocks/comparison-vs — the two halves stay side by side (that IS the block); only the
     images go fluid so the pair fits a phone. */
  .cvs-img{width:100%!important;height:auto!important;}
  /* blocks/offer-panel — the 60px display value needs the side padding back. */
  .op{padding:36px 24px 38px!important;}
  .op .ov{font-size:44px!important;}
  /* The rotated "sticker" is offset +150px from centre. position:relative offsets do not
     resize the parent, but they DO extend the document's scroll width — which is what pushed
     an offer-panel email past a phone viewport even though nothing in it is 600px wide. */
  .op-tag{left:64px!important;}
}
</style>
